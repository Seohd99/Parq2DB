# Parq2DB example settings. Copy this file to config/parq2db.toml and edit it.
# config/parq2db.toml and config/parq2db.local.toml are ignored by Git.
#
# Read the password from the environment variable named by password_env.
# If you cannot use an environment variable, set [db.oracle] password = "..." in config/parq2db.local.toml.
# (A password in this file or parq2db.toml is ignored and triggers a warning.)

[server]
host = "127.0.0.1"          # Do not change to 0.0.0.0; this tool is for local use only.
port = 8765
upload_max_mb = 2048
allowed_roots = ["D:\\data"]  # Windows example. macOS/Linux: ["/home/me/data"]
# allowed_hosts = ["pb.lan:8765"]  # Extra host names; any supplied port is ignored.

[load]
batch_size = 10000
child_max_depth = 3

[updates]
check = true  # Ask GitHub for a newer release when the web UI opens; false turns it off.

# Without the following section, the database stays offline (inspection and DDL remain available).


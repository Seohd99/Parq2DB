# ParqBridge example settings. Copy this file to config/parqbridge.toml and edit it.
# config/parqbridge.toml and config/parqbridge.local.toml are ignored by Git.
#
# Read the password from the environment variable named by password_env.
# If you cannot use an environment variable, set [db.oracle] password = "..." in config/parqbridge.local.toml.
# (A password in this file or parqbridge.toml is ignored and triggers a warning.)

[server]
host = "127.0.0.1"          # Do not change to 0.0.0.0; this tool is for local use only.
port = 8765
upload_max_mb = 2048
allowed_roots = ["D:\\data"]  # Windows example. macOS/Linux: ["/home/me/data"]

[load]
batch_size = 10000
child_max_depth = 3


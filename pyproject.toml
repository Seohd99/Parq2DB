[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parqbridge"
version = "0.1.0"
description = "Local Parquet inspection, DDL, and database loading tool"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
parqbridge = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["i18n/*.json", "static/*"]
